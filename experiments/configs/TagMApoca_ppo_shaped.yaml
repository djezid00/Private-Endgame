# 1v1 RIGOR PHASE — PPO, SHAPED arm (PBS distance shaping coef 0.5), 5M budget.
# 2x2 comparison vs MA-POCA. Identical network/self_play to the POCA 5M configs; only
# trainer_type (poca->ppo) and environment_parameters differ. individual_terminal_reward=1.0
# makes TagArenaManager ALSO deliver the terminal ±1 via AddReward, because PPO ignores group rewards.
# Run seed 1 so it lines up with POCA_sparse_s1.
behaviors:
  Chaser:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 50000
    checkpoint_interval: 250000
    keep_checkpoints: 20
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 50000
      swap_steps: 50000
      team_change: 100000
      initial_elo: 1200.0
  Runner:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 50000
    checkpoint_interval: 250000
    keep_checkpoints: 20
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 50000
      swap_steps: 50000
      team_change: 100000
      initial_elo: 1200.0

environment_parameters:
  distance_shaping_coef: 0.5
  individual_terminal_reward: 1.0
