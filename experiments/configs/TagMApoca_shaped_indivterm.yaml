# FOLLOW-UP — MA-POCA, SHAPED arm + INDIVIDUAL terminal reward, 5M budget.
# Identical to TagMApoca_shaped_5M.yaml EXCEPT it also sets individual_terminal_reward: 1.0,
# so TagArenaManager delivers the terminal ±1 (+bonuses) via each agent's AddReward in ADDITION
# to the group reward. Tests whether the POCA_shaped proximity-farming trap (catch rate ~0) is
# caused by routing the terminal ONLY through the group channel while PBS shaping floods the
# individual channel. Prediction: catch rate jumps toward the PPO_shaped ~0.98 if delivery is the cause.
# Run seed 1: run-id POCA_shaped_indivterm_s1.
behaviors:
  Chaser:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 50000
    checkpoint_interval: 250000
    keep_checkpoints: 20
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 50000
      swap_steps: 50000
      team_change: 100000
      initial_elo: 1200.0
  Runner:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 50000
    checkpoint_interval: 250000
    keep_checkpoints: 20
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 50000
      swap_steps: 50000
      team_change: 100000
      initial_elo: 1200.0

environment_parameters:
  distance_shaping_coef: 0.5
  individual_terminal_reward: 1.0
