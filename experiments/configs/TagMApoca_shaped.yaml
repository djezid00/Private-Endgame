# Validation arm B — SHAPED: sparse reward PLUS potential-based distance shaping for the
# chaser (coef 0.5). Everything except distance_shaping_coef matches TagMApoca_sparse.yaml.
behaviors:
  Chaser:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 400000
    time_horizon: 256
    summary_freq: 10000
    checkpoint_interval: 100000
    keep_checkpoints: 5
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 25000
      swap_steps: 25000
      team_change: 50000
      initial_elo: 1200.0
  Runner:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 400000
    time_horizon: 256
    summary_freq: 10000
    checkpoint_interval: 100000
    keep_checkpoints: 5
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 25000
      swap_steps: 25000
      team_change: 50000
      initial_elo: 1200.0

environment_parameters:
  distance_shaping_coef: 0.5
