# SMOKE GATE for the gamma probes: 50k, shaped, gamma 0.8 — verifies the binary
# reads shaping_gamma (check the [TagAgent] log line in the run log).
behaviors:
  Chaser:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.8
        strength: 1.0
    max_steps: 50000
    time_horizon: 256
    summary_freq: 10000
    checkpoint_interval: 25000
    keep_checkpoints: 20
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 5000
      swap_steps: 3000
      team_change: 20000
      initial_elo: 1200.0
  Runner:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.8
        strength: 1.0
    max_steps: 50000
    time_horizon: 256
    summary_freq: 10000
    checkpoint_interval: 25000
    keep_checkpoints: 20
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 5000
      swap_steps: 3000
      team_change: 20000
      initial_elo: 1200.0

environment_parameters:
  distance_shaping_coef: 0.5
  shaping_gamma: 0.8
  num_obstacles: 0
  obstacle_layout: 0
